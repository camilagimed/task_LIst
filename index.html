<!doctype html>
<html lang="pt-BR" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lista de tarefas</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <header class="page-header">
    <div class="container">
      <h1>Lista de tarefas</h1>
      <button type="button" id="theme-toggle" class="theme-toggle">Modo escuro</button>
    </div>
  </header>

  <main class="container">
    <form class="task-form">
      <label for="task-title">Título da tarefa</label>
      <input id="task-title" name="title" type="text" required>
      <button type="submit">Adicionar</button>
    </form>

    <div class="task-filters" role="group" aria-label="Filtrar tarefas por status">
      <button type="button" data-filter="todas" aria-pressed="true">Todas</button>
      <button type="button" data-filter="pendente" aria-pressed="false">Pendentes</button>
      <button type="button" data-filter="concluida" aria-pressed="false">Concluídas</button>
    </div>

    <ul class="task-list"></ul>
  </main>

  <footer class="page-footer">
    <div class="container" id="task-count" aria-live="polite">0 tarefas</div>
  </footer>
</body>
</html>
